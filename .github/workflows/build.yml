name: Build tweak & package

on:
  workflow_dispatch:
    inputs:
      base_ipa_url:
        description: "可选：基座 ipa 直链 URL（留空则只构建 dylib）"
        required: false
        default: ""
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装工具链（zig 交叉 + macholib + ldid）
        run: |
          pip install ziglang
          sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev
          git clone --depth 1 https://github.com/osy/ldid.git ldid-src
          make -C ldid-src -j4
          sudo cp ldid-src/ldid /usr/local/bin/ && ldid -V || true

      - name: 编译 dylib（arm64）
        run: bash tweak/build.sh

      - name: 验证产物
        run: |
          python3 -c '
          import struct
          d = open("tweak/build/PvzFusionTweak.dylib","rb").read(20)
          magic, cpu, _, ft = struct.unpack("<IiiI", d[:16])
          assert magic == 0xFEEDFACF and (cpu & 0xFFFFFF) == 12 and ft == 6, "bad output"
          print("OK: arm64 Mach-O dylib")
          '

      - name: 注入基座 ipa（可选）
        if: ${{ inputs.base_ipa_url != '' }}
        run: |
          curl -L -o base.ipa "${{ inputs.base_ipa_url }}"
          pip install python3-macholib || true
          python3 packaging/inject_dylib.py base.ipa tweak/build/PvzFusionTweak.dylib PvzFusion-iOS.ipa

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: pvz-fusion-ios-build
          path: |
            tweak/build/PvzFusionTweak.dylib
            PvzFusion-iOS.ipa
          if-no-files-found: warn

      - name: 发布 Release（tag 推送时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tweak/build/PvzFusionTweak.dylib
            PvzFusion-iOS.ipa
          generate_release_notes: true
