name: Build tweak & package

on:
  workflow_dispatch:
    inputs:
      base_ipa_url:
        description: "可选：基座 ipa 直链 URL（留空则只构建 dylib）"
        required: false
        default: ""
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 ldid
        run: brew install ldid

      - name: 编译 dylib
        run: make -C tweak

      - name: 注入基座 ipa（可选）
        if: ${{ inputs.base_ipa_url != '' }}
        run: |
          curl -L -o base.ipa "${{ inputs.base_ipa_url }}"
          chmod +x packaging/make_ipa.sh
          ./packaging/make_ipa.sh base.ipa tweak/build/PvzFusionTweak.dylib PvzFusion-iOS.ipa

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: pvz-fusion-ios-build
          path: |
            tweak/build/PvzFusionTweak.dylib
            PvzFusion-iOS.ipa
          if-no-files-found: ignore

      - name: 发布 Release（tag 推送时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tweak/build/PvzFusionTweak.dylib
            PvzFusion-iOS.ipa
          generate_release_notes: true
