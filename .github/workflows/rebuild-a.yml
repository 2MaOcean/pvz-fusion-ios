name: Rebuild 4.1 — Stage A (AssetRipper 逆向)

on:
  workflow_dispatch:

jobs:
  ripper:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - name: 下载 4.1 源数据
        run: |
          curl -sL -o game41.tar "https://github.com/${{ github.repository }}/releases/download/game41-source/game41.tar"
          mkdir game41 && tar xf game41.tar -C game41 --strip-components=1
          du -sh game41
          ls game41

      - name: 下载 AssetRipper (mac arm64)
        run: |
          curl -sL -o ar.tar.xz "https://github.com/AssetRipper/AssetRipper/releases/download/2.0.0/AssetRipper_mac_arm64.tar.xz"
          mkdir -p ar && tar xf ar.tar.xz -C ar
          # Apple Silicon 强制签名：对全部可执行与动态库做 ad-hoc 签名
          find ar -type f \( -perm +111 -o -name "*.dylib" \) -exec codesign --force --sign - {} \; 2>/dev/null || true
          find ar -type f | head -20

      - name: 启动 headless 服务
        run: |
          cd ar
          EXE=$(find . -type f -perm +111 | grep -i "AssetRipper.GUI" | head -1)
          chmod +x "$EXE"
          nohup "$EXE" --headless --port 8080 --log false > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/ | grep -q 200 && echo "server up" && break
            sleep 2
          done
          curl -s http://127.0.0.1:8080/ | head -5

      - name: 加载 4.1 数据
        run: |
          curl -s -L --max-time 3600 -X POST \
            -d "Path=$GITHUB_WORKSPACE/game41" \
            http://127.0.0.1:8080/LoadFolder -o load_result.html -w "http:%{http_code} time:%{time_total}s\n"
          grep -io "error\|failed" load_result.html | head -3 || echo "load ok"

      - name: 导出 Unity 工程
        run: |
          curl -s -L --max-time 3600 -X POST \
            -d "Path=$GITHUB_WORKSPACE/ExportedProject" \
            http://127.0.0.1:8080/Export/UnityProject -o export_result.html -w "http:%{http_code} time:%{time_total}s\n"
          du -sh ExportedProject 2>/dev/null || echo "export failed"
          find ExportedProject -maxdepth 2 -type d 2>/dev/null | head -20

      - name: 上传 ExportedProject
        uses: actions/upload-artifact@v4
        with:
          name: exported-project-41
          path: ExportedProject
          retention-days: 7

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripper-logs
          path: |
            ar/server.log
            load_result.html
            export_result.html
          if-no-files-found: ignore
