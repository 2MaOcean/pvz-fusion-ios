name: Rebuild 4.1 — Stage A (AssetRipper 逆向)

on:
  workflow_dispatch:

jobs:
  ripper:
    runs-on: macos-15
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - name: 下载 4.1 源数据
        run: |
          curl -sL -o game41.tar "https://github.com/${{ github.repository }}/releases/download/game41-source/game41.tar"
          mkdir game41 && tar xf game41.tar -C game41 --strip-components=1
          du -sh game41

      - name: 下载 AssetRipper (mac arm64)
        run: |
          curl -sL -o ar.tar.xz "https://github.com/AssetRipper/AssetRipper/releases/download/2.0.0/AssetRipper_mac_arm64.tar.xz"
          mkdir -p ar && tar xf ar.tar.xz -C ar
          find ar -type f \( -perm +111 -o -name "*.dylib" \) -exec codesign --force --sign - {} \; 2>/dev/null || true

      - name: 启动 headless 服务
        run: |
          cd ar
          EXE=$(find . -type f -perm +111 | grep -i "AssetRipper.GUI" | head -1)
          chmod +x "$EXE"
          nohup "$EXE" --headless --port 8080 > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/ | grep -q 200 && echo "server up" && break
            sleep 2
          done

      - name: 加载 4.1 数据
        run: |
          curl -s -L --max-time 3600 -X POST \
            -d "Path=$GITHUB_WORKSPACE/game41" \
            http://127.0.0.1:8080/LoadFolder -o load_result.html -w "http:%{http_code} time:%{time_total}s\n" || true
          echo "loaded (redirect semantics; verify via export)"

      - name: 导出 Unity 工程
        run: |
          curl -s -L --max-time 3600 -X POST \
            -d "Path=$GITHUB_WORKSPACE/ExportedProject" \
            http://127.0.0.1:8080/Export/UnityProject -o export_result.html -w "http:%{http_code} time:%{time_total}s\n" || true
          du -sh ExportedProject
          find ExportedProject -maxdepth 3 -type d | head -25
          echo "--- 脚本采样 ---"
          find ExportedProject -name "*.cs" -path "*Scripts*" | head -15
          CS_COUNT=$(find ExportedProject -name "*.cs" | wc -l)
          echo "C# 文件总数: $CS_COUNT"
          [ "$CS_COUNT" -gt 500 ] && echo "EXPORT_CONTENT_OK" || echo "EXPORT_SUSPECT"

      - name: 压缩并上传到 Release
        run: |
          cd "$GITHUB_WORKSPACE"
          tar czf exported-41.tar.gz ExportedProject
          du -sh exported-41.tar.gz
          TAG="rebuild-41-stagea"
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"ExportedProject 4.1\",\"body\":\"AssetRipper 逆向产物（阶段A）\"}" | python3 -c "import json,sys;print(json.load(sys.stdin).get('upload_url','existing').split('{')[0])" > up.url
          UP=$(cat up.url)
          [ -n "$UP" ] || UP="https://uploads.github.com/repos/${{ github.repository }}/releases/$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')/assets"
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/gzip" \
            --data-binary @exported-41.tar.gz "$UP?name=exported-41.tar.gz" | python3 -c "import json,sys;d=json.load(sys.stdin);print('uploaded:', d.get('name'), d.get('size'), d.get('message',''))"

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripper-logs
          path: |
            ar/server.log
            load_result.html
            export_result.html
          if-no-files-found: ignore
