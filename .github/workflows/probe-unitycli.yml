name: Probe unity-cli license activation
on: workflow_dispatch
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: 安装并枚举参数
        run: |
          npm install -g @rage-against-the-pixel/unity-cli@3 2>&1 | tail -2
          echo "=== activate-license help ==="
          unity-cli activate-license --help < /dev/null 2>&1 | head -50 || true
          echo "=== 顶层 help ==="
          unity-cli --help < /dev/null 2>&1 | head -30 || true

      - name: Personal 在线激活测试（stdin 喂凭据）
        run: |
          unity-cli activate-license --license personal < /dev/null 2>&1 | head -10 || true
          # 交互式喂入
          printf "%s\n%s\n" "${{ secrets.UNITY_EMAIL }}" "${{ secrets.UNITY_PASSWORD }}" | \
            timeout 240 unity-cli activate-license --license personal 2>&1 | head -50 || true
          echo "--- ulf 检查 ---"
          find "$HOME" -name "*.ulf" 2>/dev/null | head -5
