name: Rebuild 4.1 — Android APK(Unity 2022.3.62 Android target)

on:
  workflow_dispatch:

env:
  UNITY_VERSION: 2022.3.62f1
  UNITY_CHANGESET: 4af31df58517

jobs:
  build-apk:
    runs-on: macos-15
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 恢复 Unity 缓存(复用 iOS 构建的编辑器缓存)
        id: unity
        uses: actions/cache@v4
        with:
          path: /Applications/Unity
          key: unity-2022.3.62f1-arm64-ios

      - name: 安装编辑器(仅缓存未命中时)
        if: steps.unity.outputs.cache-hit != 'true'
        run: |
          set -x
          BASE="https://download.unity3d.com/download_unity/${UNITY_CHANGESET}"
          for i in 1 2 3 4 5; do
            curl -sL --retry 5 --retry-all-errors -C -               -o /tmp/unity-editor.pkg "$BASE/MacEditorInstallerArm64/Unity-${UNITY_VERSION}.pkg" && break
            sleep 15
          done
          sudo installer -pkg /tmp/unity-editor.pkg -target /

      - name: 安装 Android Build Support(编辑器在场即可)
        run: |
          set -x
          if [ -d "/Applications/Unity/PlaybackEngines/AndroidPlayer" ]; then
            echo "Android 支持已安装"; ls /Applications/Unity/PlaybackEngines/AndroidPlayer/ | head -3; exit 0
          fi
          [ -d "/Applications/Unity/Unity.app" ] || { echo "FATAL: Unity 编辑器不存在且缓存未命中"; exit 1; }
          BASE="https://download.unity3d.com/download_unity/${UNITY_CHANGESET}"
          for i in 1 2 3 4 5; do
            curl -sL --retry 5 --retry-all-errors -C -               -o /tmp/android.tar.xz "$BASE/MacEditorTargetInstaller/UnitySetup-Android-Support-for-Editor-${UNITY_VERSION}.tar.xz" && break
            sleep 15
          done
          sudo mkdir -p /Applications/Unity/PlaybackEngines
          sudo tar xJf /tmp/android.tar.xz -C "/Applications/Unity/PlaybackEngines/" || {
            for i in 1 2 3; do
              curl -sL --retry 5 --retry-all-errors -C -                 -o /tmp/android.pkg "$BASE/MacEditorTargetInstaller/UnitySetup-Android-Support-for-Editor-${UNITY_VERSION}.pkg" && break
              sleep 15
            done
            sudo installer -pkg /tmp/android.pkg -target /; }
          ls /Applications/Unity/PlaybackEngines/AndroidPlayer/ | head -5

      - name: 设置 UNITY_EXE
        run: |
          UNI=$(find /Applications -maxdepth 5 -path "*Unity.app/Contents/MacOS/Unity" | head -1)
          [ -n "$UNI" ] || { echo "NO UNITY EXE"; exit 1; }
          echo "UNITY_EXE=$UNI" >> $GITHUB_ENV
          "$UNI" -version

      - name: Hub + license 激活
        run: |
          brew install --cask unity-hub >/dev/null 2>&1 || true
          sudo xattr -dr com.apple.quarantine "/Applications/Unity Hub.app" 2>/dev/null || true
          sudo mkdir -p "/Library/Application Support/Unity"
          sudo chown -R "$(whoami)" "/Library/Application Support/Unity"
          npm install -g @rage-against-the-pixel/unity-cli@3 2>&1 | tail -1
          for ip in $(dig +short A public-cdn.cloud.unity3d.com | grep -E '^[0-9]+\.'); do
            echo "block drop out proto tcp to $ip port 443" | sudo tee -a /tmp/pfrules
          done
          (echo "set skip on lo0"; cat /tmp/pfrules) | sudo pfctl -f - 2>/dev/null || true
          sudo pfctl -e 2>/dev/null || true
          unity-cli activate-license -l personal \
            -e "${{ secrets.UNITY_EMAIL }}" \
            -p "${{ secrets.UNITY_PASSWORD }}" 2>&1 | grep -vi password | head -8 || true

      - name: 下载 ExportedProject(累积修复版优先)+ 恢复源码
        run: |
          set -x
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          FIXED_URL=$(curl -s -H "Authorization: token $TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/rebuild-41-progress" --max-time 40 \
            | python3 -c "import json,sys; d=json.load(sys.stdin); a=[x for x in d.get('assets',[]) if x['name']=='ep-assets-fixed.tar.gz']; print(a[0]['browser_download_url'] if a else '')" 2>/dev/null)
          if [ -n "$FIXED_URL" ]; then
            curl -sfL --retry 3 --retry-all-errors -o ep.tar.gz "$FIXED_URL" 2>/dev/null
            if [ -s ep.tar.gz ] && tar xzf ep.tar.gz 2>/dev/null && [ -d ExportedProject/ExportedProject/Assets/Plugins ]; then
              echo "累积版 OK"
              curl -sfL -o ep-orig.tar.gz "https://github.com/${{ github.repository }}/releases/download/rebuild-41-stagea/exported-41.tar.gz"
              tar xzf ep-orig.tar.gz ExportedProject/ExportedProject/Packages 2>/dev/null || true
            else
              rm -rf ExportedProject ep.tar.gz
              curl -sfL -o ep.tar.gz "https://github.com/${{ github.repository }}/releases/download/rebuild-41-stagea/exported-41.tar.gz"
              tar xzf ep.tar.gz
              cp ep.tar.gz ep-orig.tar.gz
            fi
          else
            curl -sfL -o ep.tar.gz "https://github.com/${{ github.repository }}/releases/download/rebuild-41-stagea/exported-41.tar.gz"
            tar xzf ep.tar.gz
            cp ep.tar.gz ep-orig.tar.gz
          fi
          [ -d ExportedProject/ExportedProject/Assets/Plugins ] || { echo "FATAL: Assets/Plugins 缺失"; exit 1; }

      - name: 替换 + 预删 Plugins dummy + 源码恢复 + Core stub
        run: |
          set -x
          P=ExportedProject/ExportedProject/Assets/Plugins
          DUMMY_DIR=/tmp/ild/DummyDll
          # DummyDll 替换(同名保留 meta;UnityEngine.* 跳过)
          for f in "$DUMMY_DIR"/*.dll; do
            n=$(basename "$f")
            [ "$n" = "Assembly-CSharp.dll" ] && continue
            case "$n" in UnityEngine.*) continue;; esac
            [ -f "$P/$n" ] && cp "$f" "$P/$n" && echo "replaced $n"
          done
          KEEP_META_LIST="Unity.RenderPipelines.Core.Runtime Unity.RenderPipelines.Universal.Runtime Unity.2D.Animation.Runtime Unity.2D.Common.Runtime Unity.2D.SpriteShape.Runtime Unity.2D.Tilemap.Extras Unity.TextMeshPro Unity.Collections Unity.Burst Unity.Burst.Unsafe Unity.Collections.LowLevel.ILSupport Unity.Mathematics Unity.VisualScripting.Core spine-csharp spine-unity UniTask SimpleFileBrowser.Runtime UnityEngine.UI"
          for n in $KEEP_META_LIST; do
            rm -f "$P/$n.dll" && echo "pre-deleted $n.dll (meta kept)"
          done
          rm -f "$P/__Generated.dll" "$P/__Generated.dll.meta" "$P/System.Runtime.CompilerServices.Unsafe.dll" "$P/System.Runtime.CompilerServices.Unsafe.dll.meta"
          rm -f "$P/Core.dll" "$P/Unity.MemoryProfiler.dll" "$P/Unity.InternalAPIEngineBridge.001.dll" "$P/Unity.RenderPipeline.Universal.ShaderLibrary.dll"
          # Core stub(源码真实化)
          S=ExportedProject/ExportedProject/Assets/Scripts
          mkdir -p ExportedProject/ExportedProject/Assets/CoreSrc
          cat > ExportedProject/ExportedProject/Assets/CoreSrc/Singleton.cs <<'EOF'
          namespace Core {
              public abstract class Singleton<T> : UnityEngine.MonoBehaviour where T : UnityEngine.MonoBehaviour {
                  public static T Instance;
              }
          }
          EOF
          # 源码完整性恢复(缺失类从原始包找回;排除 Core;解除误禁用;清 stub)
          if [ ! -f ep-orig.tar.gz ]; then
            curl -sfL -o ep-orig.tar.gz "https://github.com/${{ github.repository }}/releases/download/rebuild-41-stagea/exported-41.tar.gz"
          fi
          rm -rf /tmp/orig-src && mkdir -p /tmp/orig-src
          tar xzf ep-orig.tar.gz -C /tmp/orig-src "ExportedProject/ExportedProject/Assets/Scripts" 2>/dev/null || true
          ORIG=/tmp/orig-src/ExportedProject/ExportedProject/Assets/Scripts
          cd "$ORIG" && find . \( -path ./Assembly-CSharp/Core -o -path ./Assembly-CSharp/Core.meta \) -prune -o \( -name "*.cs" -o -name "*.cs.meta" \) -print | while read -r rel; do
            if [ ! -f "$OLDPWD/$S/$rel" ]; then
              mkdir -p "$OLDPWD/$S/$(dirname "$rel")"
              cp "$rel" "$OLDPWD/$S/$rel"
            fi
          done
          cd "$GITHUB_WORKSPACE"
          find "$S" -name "*.cs.disabled" | while read -r f; do mv -f "$f" "${f%.disabled}"; done
          find "$S" -name "*.cs.disabled.meta" | while read -r f; do mv -f "$f" "${f%.disabled.meta}.meta"; done
          rm -rf ExportedProject/ExportedProject/Assets/Scripts/Stubs ExportedProject/ExportedProject/Assets/Scripts/Stubs.meta
          echo "源码恢复后: $(find $S -name '*.cs' | wc -l) 个 .cs"

      - name: Newtonsoft.Json 真实 DLL
        run: |
          set -x
          P=ExportedProject/ExportedProject/Assets/Plugins
          curl -sL -o nj.nupkg "https://api.nuget.org/v3-flatcontainer/newtonsoft.json/13.0.3/newtonsoft.json.13.0.3.nupkg"
          unzip -o -q nj.nupkg -d nj
          NJDLL=$(find nj -path "*netstandard2.0*" -name "Newtonsoft.Json.dll" | head -1)
          cp "$NJDLL" "$P/Newtonsoft.Json.dll"

      - name: manifest 写入官方包 + 第三方源码 + asmdef + csc.rsp
        run: |
          set -x
          cd ExportedProject/ExportedProject
          python3 - <<'PY'
          import json
          pkgs = {
            "com.unity.render-pipelines.universal": "14.0.11",
            "com.unity.render-pipelines.core":      "14.0.11",
            "com.unity.shadergraph":                "14.0.11",
            "com.unity.2d.animation":               "9.2.1",
            "com.unity.2d.common":                  "8.1.1",
            "com.unity.2d.spriteshape":             "8.0.1",
            "com.unity.2d.tilemap.extras":          "3.1.2",
            "com.unity.textmeshpro":                "3.0.9",
            "com.unity.burst":                      "1.8.19",
            "com.unity.collections":                "1.5.1",
            "com.unity.mathematics":                "1.2.6",
            "com.unity.visualscripting":            "1.9.4",
            "com.unity.ugui":                       "1.0.0",
          }
          mf = json.load(open("Packages/manifest.json"))
          mf["dependencies"].update(pkgs)
          # 版本值清洗:非字符串值(反编译工程常见的 object)强制置为 1.0.0
          bad = {k: v for k, v in mf["dependencies"].items() if not isinstance(v, str)}
          for k in bad:
              print("WARN: non-string version ->", k, "=", mf["dependencies"][k])
              mf["dependencies"][k] = "1.0.0"
          json.dump(mf, open("Packages/manifest.json","w"), indent=2)
          print("manifest updated", len(pkgs), "bad-fixed", len(bad))
          PY
          cat Packages/manifest.json | head -40
          A=Assets/ThirdParty
          mkdir -p "$A/spine" "$A/unitask" "$A/sfb"
          for TRY in 1 2 3; do
            git clone --depth 1 --filter=blob:none --sparse --branch 4.1 \
              https://github.com/EsotericSoftware/spine-runtimes /tmp/spine 2>&1 | tail -1 && break
            rm -rf /tmp/spine; sleep 10
          done
          (cd /tmp/spine && git sparse-checkout set spine-unity/Assets/Spine spine-csharp/src 2>&1 | tail -1)
          cp -R /tmp/spine/spine-unity/Assets/Spine/Runtime/* "$A/spine/" 2>/dev/null || true
          cp -R /tmp/spine/spine-csharp/src/* "$A/spine/" 2>/dev/null || true
          find "$A/spine" -name "*.asmdef*" -delete
          for TRY in 1 2 3; do
            git clone --depth 1 --branch 2.5.10 https://github.com/Cysharp/UniTask /tmp/unitask-repo 2>&1 | tail -1 && break
            rm -rf /tmp/unitask-repo; sleep 10
          done
          cp -R /tmp/unitask-repo/src/UniTask/Assets/Plugins/UniTask/Runtime/* "$A/unitask/"
          find "$A/unitask" -name "*.asmdef*" -delete
          grep -rl 'UNITASK_WEBREQUEST_SUPPORT' "$A/unitask/" 2>/dev/null | while read -r f; do
            sed -i.bak 's/#if ENABLE_UNITYWEBREQUEST && (!UNITY_2019_1_OR_NEWER || UNITASK_WEBREQUEST_SUPPORT)/#if ENABLE_UNITYWEBREQUEST/' "$f" 2>/dev/null || \
              sed -i 's/#if ENABLE_UNITYWEBREQUEST && (!UNITY_2019_1_OR_NEWER || UNITASK_WEBREQUEST_SUPPORT)/#if ENABLE_UNITYWEBREQUEST/' "$f"
            rm -f "$f.bak"
          done
          for TRY in 1 2 3; do
            git clone --depth 1 https://github.com/yasirkula/UnitySimpleFileBrowser /tmp/sfb-repo 2>&1 | tail -1 && break
            rm -rf /tmp/sfb-repo; sleep 10
          done
          cp -R /tmp/sfb-repo/Plugins/SimpleFileBrowser/* "$A/sfb/"
          find "$A/sfb" -name "*.asmdef*" -delete
          cat > "$A/spine/spine-unity.asmdef" <<'EOF'
          { "name": "spine-unity", "allowUnsafeCode": true, "autoReferenced": true }
          EOF
          cat > "$A/unitask/UniTask.asmdef" <<'EOF'
          { "name": "UniTask", "allowUnsafeCode": true, "autoReferenced": true }
          EOF
          cat > "$A/sfb/SimpleFileBrowser.Runtime.asmdef" <<'EOF'
          { "name": "SimpleFileBrowser.Runtime", "autoReferenced": true, "references": ["Unity.TextMeshPro"] }
          EOF
          cat > Assets/CoreSrc/Core.asmdef <<'EOF'
          { "name": "Core", "autoReferenced": true, "allowUnsafeCode": true }
          EOF
          printf '%s\n' -nowarn:0114 -nowarn:0108 -nowarn:0109 -nowarn:0649 \
            -nowarn:0219 -nowarn:0414 -nowarn:0067 -nowarn:0660 -nowarn:0661 -nowarn:3021 \
            > Assets/csc.rsp

      - name: 注入 CIPrepare(Android + keystore)
        run: |
          mkdir -p ExportedProject/ExportedProject/Assets/Editor
          cat > ExportedProject/ExportedProject/Assets/Editor/CIPrepareAndroid.cs <<'CS'
          using UnityEditor;
          using UnityEditor.Build.Reporting;
          using UnityEngine;
          using System.Linq;
          using System.IO;
          public static class CIPrepareAndroid {
              public static void PrepareAndBuild() {
                  // 不配置 keystore:Unity 对未指定签名的 Android build 自动使用 debug 签名
                  PlayerSettings.Android.minSdkVersion = AndroidSdkVersions.AndroidApiLevel24;
                  // il2cpp 必须显式指定目标架构(否则 "Target architecture not specified")
                  PlayerSettings.Android.targetArchitectures = AndroidArchitecture.ARM64;
                  PlayerSettings.SetScriptingBackend(BuildTargetGroup.Android, ScriptingImplementation.IL2CPP);

                  var scenes = Directory.GetFiles("Assets", "*.unity", SearchOption.AllDirectories)
                      .Where(p => !p.Contains("/Plugins/"))
                      .Select(p => p.Replace("\\\\", "/")).OrderBy(p => p).ToArray();
                  Debug.Log("[CI] scenes: " + scenes.Length);
                  var opt = new BuildPlayerOptions {
                      scenes = scenes.Length > 0 ? scenes : new[]{"Assets/Scenes/SampleScene.unity"},
                      locationPathName = "androidbuild/PvzFusion41.apk",
                      target = BuildTarget.Android,
                      options = BuildOptions.None
                  };
                  var report = BuildPipeline.BuildPlayer(opt);
                  Debug.Log("[CI] android result=" + report.summary.result + " size=" + report.summary.totalSize);
                  if (report.summary.result != BuildResult.Succeeded) EditorApplication.Exit(2);
              }
          }
          CS
          echo "CIPrepareAndroid injected"

      - name: 补 SDK cmdline-tools + licenses
        run: |
          set -x
          SDK=/Applications/Unity/PlaybackEngines/AndroidPlayer/SDK
          sudo chown -R "$(whoami)" /Applications/Unity/PlaybackEngines/AndroidPlayer
          mkdir -p "$SDK/cmdline-tools"
          if [ ! -d "$SDK/cmdline-tools/latest" ]; then
            for i in 1 2 3; do
              curl -sL --retry 3 --retry-all-errors -o /tmp/clt.zip \
                "https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip" && break
              sleep 10
            done
            unzip -q /tmp/clt.zip -d /tmp/clt
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          chmod +x "$SDK/cmdline-tools/latest/bin/"* || true
          # sdkmanager(class 61)需要 Java 17:用 runner 的 Temurin 17
          export JAVA_HOME="${JAVA_HOME_17_arm64:-$JAVA_HOME_17_X64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version 2>&1 | head -1
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-33" "build-tools;33.0.2" > /dev/null 2>&1 || true
          # Unity 进程内嵌 OpenJDK 是 11(sdkmanager 要 17)→ 整个替换为 17 符号链接
          sudo rm -rf /Applications/Unity/PlaybackEngines/AndroidPlayer/OpenJDK
          # mac JDK 布局:arm64/Contents/Home → Unity 期望 OpenJDK/Contents/Home,指向 arm64 层
          sudo ln -sfn "$(dirname "${JAVA_HOME%/}")" /Applications/Unity/PlaybackEngines/AndroidPlayer/OpenJDK
          # 同时设置 Unity 的 JDK 路径(EditorPrefs)——确保以 /Home 结尾
          JDK17="${JAVA_HOME%/}"
          [[ "$JDK17" != */Home ]] && JDK17="$JDK17/Home"
          defaults write com.unity3d.UnityEditor5.x JdkRoot "$JDK17"
          defaults read com.unity3d.UnityEditor5.x JdkRoot
          "/Applications/Unity/PlaybackEngines/AndroidPlayer/OpenJDK/bin/java" -version 2>&1 | head -1
          ls "$SDK" | head -8

      - name: 修复-构建迭代循环(Android,20 轮)
        run: |
          set -x
          cd ExportedProject/ExportedProject
          UNI="$UNITY_EXE"
          LOG="$PWD/unity_build.log"
          SUCCESS=0
          for ROUND in $(seq 1 20); do
            echo "########## 迭代 $ROUND ##########"
            rm -f "$LOG"
            perl -e 'alarm 3000; exec @ARGV' "$UNI" \
              -batchmode -nographics \
              -projectPath "$PWD" \
              -buildTarget Android \
              -executeMethod CIPrepareAndroid.PrepareAndBuild \
              -logFile - 2>&1 | tee "$LOG"
            if [ -f androidbuild/PvzFusion41.apk ]; then
              echo "APK_READY"; SUCCESS=1; break
            fi
            python3 "$GITHUB_WORKSPACE/tools/fix_compile_errors.py" "$LOG" "$PWD" || true
            tail -6 "$LOG" 2>/dev/null || true
          done
          echo "FINAL: $([ "$SUCCESS" = 1 ] && echo SUCCESS || echo NEED_MANUAL)"

      - name: 上传 APK 到 Release(android-build)
        if: always()
        run: |
          set -x
          cd ExportedProject/ExportedProject
          [ -f androidbuild/PvzFusion41.apk ] || { echo "no apk"; exit 0; }
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          curl -s -X POST -H "Authorization: token $TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d '{"tag_name":"android-build","name":"PvZ Fusion 4.1 Android APK"}' > /dev/null
          REL=$(curl -s -H "Authorization: token $TOKEN" https://api.github.com/repos/${{ github.repository }}/releases/tags/android-build | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          OLD=$(curl -s -H "Authorization: token $TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/tags/android-build" | python3 -c "import json,sys;d=json.load(sys.stdin);a=[x for x in d.get('assets',[]) if x['name']=='PvzFusion41.apk'];print(a[0]['id'] if a else '')")
          [ -n "$OLD" ] && [ "$OLD" != "None" ] && curl -s -X DELETE -H "Authorization: token $TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/assets/$OLD" > /dev/null
          curl -s -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/octet-stream" \
            --data-binary @androidbuild/PvzFusion41.apk \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$REL/assets?name=PvzFusion41.apk" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print('APK RELEASED:', d.get('name'), d.get('size'), d.get('message',''))"
          # 摘要
          grep -E "error CS|\[CI\] android result|FINAL:" unity_build.log | tail -100 > /tmp/apk_summary.txt || true
          curl -s -X POST -H "Authorization: token $TOKEN" -H "Content-Type: text/plain" \
            --data-binary @/tmp/apk_summary.txt \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$REL/assets?name=apk_build_summary.txt" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print('SUMMARY UP:', d.get('name'), d.get('message',''))"

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: ExportedProject/ExportedProject/unity_build.log
          if-no-files-found: ignore
