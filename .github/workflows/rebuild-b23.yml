name: Rebuild 4.1 — Stage B23 (Unity 2022.3.62 版本匹配 + 两遍法真实化)

on:
  workflow_dispatch:

env:
  UNITY_VERSION: 2022.3.62f1
  UNITY_CHANGESET: 4af31df58517

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 恢复 Unity 2022.3.62 缓存
        id: unity
        uses: actions/cache@v4
        with:
          path: /Applications/Unity
          key: unity-2022.3.62f1-arm64-ios

      - name: 安装 Unity 2022.3.62f1 ARM64 + iOS 支持
        if: steps.unity.outputs.cache-hit != 'true'
        run: |
          set -x
          BASE="https://download.unity3d.com/download_unity/${UNITY_CHANGESET}"
          # 编辑器（ARM64）
          curl -sL -o /tmp/unity-editor.pkg "$BASE/MacEditorInstallerArm64/Unity-${UNITY_VERSION}.pkg"
          sudo installer -pkg /tmp/unity-editor.pkg -target /
          # iOS build support（tar.xz 优先，pkg 兜底）
          curl -sL -o /tmp/ios.tar.xz "$BASE/MacEditorTargetInstaller/UnitySetup-iOS-Support-for-Editor-${UNITY_VERSION}.tar.xz" \
            && sudo tar xJf /tmp/ios.tar.xz -C "/Applications/Unity/" \
            || { curl -sL -o /tmp/ios.pkg "$BASE/MacEditorTargetInstaller/UnitySetup-iOS-Support-for-Editor-${UNITY_VERSION}.pkg"; sudo installer -pkg /tmp/ios.pkg -target /; }
          find /Applications -maxdepth 5 -path "*Unity.app/Contents/MacOS/Unity" | head -2

      - name: 设置 UNITY_EXE
        run: |
          UNI=$(find /Applications -maxdepth 5 -path "*Unity.app/Contents/MacOS/Unity" | head -1)
          [ -n "$UNI" ] || { echo "NO UNITY EXE"; ls /Applications; exit 1; }
          echo "UNITY_EXE=$UNI" >> $GITHUB_ENV
          "$UNI" -version

      - name: Hub + license 激活
        run: |
          brew install --cask unity-hub >/dev/null 2>&1 || true
          sudo xattr -dr com.apple.quarantine "/Applications/Unity Hub.app" 2>/dev/null || true
          sudo mkdir -p "/Library/Application Support/Unity"
          sudo chown -R "$(whoami)" "/Library/Application Support/Unity"
          npm install -g @rage-against-the-pixel/unity-cli@3 2>&1 | tail -1
          for ip in $(dig +short A public-cdn.cloud.unity3d.com | grep -E '^[0-9]+\.'); do
            echo "block drop out proto tcp to $ip port 443" | sudo tee -a /tmp/pfrules
          done
          (echo "set skip on lo0"; cat /tmp/pfrules) | sudo pfctl -f - 2>/dev/null || true
          sudo pfctl -e 2>/dev/null || true
          unity-cli activate-license -l personal \
            -e "${{ secrets.UNITY_EMAIL }}" \
            -p "${{ secrets.UNITY_PASSWORD }}" 2>&1 | grep -vi password | head -8 || true
          ls -la "/Library/Application Support/Unity/" 2>/dev/null | head -5

      - name: 下载 ExportedProject（优先用上一轮累积修复版）+ 诊断
        run: |
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          # 查 rebuild-41-ios 是否有累积修复版
          FIXED_URL=$(curl -s -H "Authorization: token $TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/rebuild-41-progress" --max-time 40 \
            | python3 -c "import json,sys; d=json.load(sys.stdin); a=[x for x in d.get('assets',[]) if x['name']=='ep-assets-fixed.tar.gz']; print(a[0]['browser_download_url'] if a else '')" 2>/dev/null)
          if [ -n "$FIXED_URL" ]; then
            echo "尝试累积修复版 Assets"
            curl -sfL --retry 3 --retry-all-errors -o ep.tar.gz "$FIXED_URL" 2>/dev/null
            if [ -s ep.tar.gz ] && tar xzf ep.tar.gz 2>/dev/null && [ -d ExportedProject/ExportedProject/Assets/Plugins ]; then
              echo "累积版解压 OK"
              curl -sL -o ep-orig.tar.gz "https://github.com/${{ github.repository }}/releases/download/rebuild-41-stagea/exported-41.tar.gz"
              tar xzf ep-orig.tar.gz ExportedProject/ExportedProject/Packages 2>/dev/null || true
            else
              echo "累积版不可用（下载中断/不完整），回退原始包"
              rm -rf ExportedProject ep.tar.gz
              curl -sfL -o ep.tar.gz "https://github.com/${{ github.repository }}/releases/download/rebuild-41-stagea/exported-41.tar.gz"
              tar xzf ep.tar.gz
            fi
          else
            echo "无累积修复版，使用原始包"
            curl -sfL -o ep.tar.gz "https://github.com/${{ github.repository }}/releases/download/rebuild-41-stagea/exported-41.tar.gz"
            tar xzf ep.tar.gz
          fi
          # 最终校验关键目录
          [ -d ExportedProject/ExportedProject/Assets/Plugins ] || { echo "FATAL: Assets/Plugins 仍缺失"; ls ExportedProject/ExportedProject/Assets/ 2>/dev/null; exit 1; }
          echo "=== Assets/Scripts 顶层目录（判断 Core/spine/UniTask 是否有源码）==="
          find ExportedProject/ExportedProject/Assets/Scripts -maxdepth 1 -type d | sort
          echo "=== 抽查 Core.dll 源码是否存在 ==="
          find ExportedProject/ExportedProject/Assets/Scripts -maxdepth 2 -iname "*core*" | head -5
          echo "=== 抽查一个方法体（验证是否真实逻辑）==="
          sed -n '1,40p' ExportedProject/ExportedProject/Assets/Scripts/Assembly-CSharp/AutoChess/AutoChessUI.cs 2>/dev/null | head -40

      - name: Il2CppDumper 生成健康 DummyDll
        run: |
          set -x
          curl -sL -o game41.tar "https://github.com/${{ github.repository }}/releases/download/game41-source/game41.tar"
          tar xf game41.tar
          find . -maxdepth 3 -name "GameAssembly.dll" | head -3
          curl -sL -o ild.zip "https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net7-v6.7.46.zip"
          mkdir -p /tmp/ild && unzip -o -q ild.zip -d /tmp/ild
          METADATA=$(find . -path "*il2cpp_data*" -name "global-metadata.dat" | head -1)
          GA=$(find . -maxdepth 3 -name "GameAssembly.dll" | head -1)
          echo "GA=$GA META=$METADATA"
          DOTNET_ROLL_FORWARD=LatestMajor dotnet /tmp/ild/Il2CppDumper.dll "$GA" "$METADATA" /tmp/ildout 2>&1 | tail -5 || true
          DUMMDIR=$(find /tmp/ildout /tmp/ild "$PWD" -maxdepth 3 -type d -name "DummyDll" 2>/dev/null | head -1)
          echo "DUMMDIR=$DUMMDIR"
          ls "$DUMMDIR" | head -10
          echo "DUMMY_DIR=$DUMMDIR" >> $GITHUB_ENV

      - name: 替换 + 预删 Plugins dummy DLL（保留 .meta GUID）
        run: |
          set -x
          P=ExportedProject/ExportedProject/Assets/Plugins
          # 1) 用 Il2CppDumper dummy 覆盖 Plugins 同名（保留 meta）
          for f in "$DUMMY_DIR"/*.dll; do
            n=$(basename "$f")
            [ "$n" = "Assembly-CSharp.dll" ] && continue
            case "$n" in UnityEngine.*) continue;; esac
            [ -f "$P/$n" ] && cp "$f" "$P/$n" && echo "replaced $n"
          done
          # 2) 预删将被真实包/第三方编译替代的 dummy DLL（保留 .meta 供 GUID 复用）
          KEEP_META_LIST="Unity.RenderPipelines.Core.Runtime Unity.RenderPipelines.Universal.Runtime Unity.2D.Animation.Runtime Unity.2D.Common.Runtime Unity.2D.SpriteShape.Runtime Unity.2D.Tilemap.Extras Unity.TextMeshPro Unity.Collections Unity.Burst Unity.Burst.Unsafe Unity.Collections.LowLevel.ILSupport Unity.Mathematics Unity.VisualScripting.Core spine-csharp spine-unity UniTask SimpleFileBrowser.Runtime UnityEngine.UI"
          # 注意：Core 不预删 —— 累积包里的真实 Core.dll 必须代代相传，删了会导致 namespace Core 消失
          # Core 源码从 Assembly-CSharp 拆出（单独编译成真实 Core.dll，走两遍法拷回）
          S=ExportedProject/ExportedProject/Assets/Scripts/Assembly-CSharp
          # 若 Core 源码双失（$S/Core 与 CoreSrc 都无 .cs），从原始包恢复
          if [ ! -d "$S/Core" ] && [ -z "$(find ExportedProject/ExportedProject/Assets/CoreSrc -name '*.cs' 2>/dev/null | head -1)" ]; then
            echo "Core 源码丢失，从原始包恢复..."
            if [ ! -f ep-orig.tar.gz ]; then
              curl -sfL -o ep-orig.tar.gz "https://github.com/${{ github.repository }}/releases/download/rebuild-41-stagea/exported-41.tar.gz"
            fi
            tar xzf ep-orig.tar.gz "ExportedProject/ExportedProject/Assets/Scripts/Assembly-CSharp/Core" 2>/dev/null || true
          fi
          if [ -d "$S/Core" ]; then
            mkdir -p ExportedProject/ExportedProject/Assets/CoreSrc
            cp -R "$S/Core/"* ExportedProject/ExportedProject/Assets/CoreSrc/ 2>/dev/null || true
            rm -rf "$S/Core" "$S/Core.meta"
            # SortingGroupRebuilder / RightMenu 反向依赖游戏代码（asmdef 无法引用 Assembly-CSharp），
            # 移回 Assembly-CSharp 程序集（保留 namespace Core，游戏代码引用可解析）
            mv -f ExportedProject/ExportedProject/Assets/CoreSrc/SortingGroupRebuilder.cs "$S/" 2>/dev/null || rm -f ExportedProject/ExportedProject/Assets/CoreSrc/SortingGroupRebuilder.cs
            mv -f ExportedProject/ExportedProject/Assets/CoreSrc/SortingGroupRebuilder.cs.meta "$S/" 2>/dev/null || rm -f ExportedProject/ExportedProject/Assets/CoreSrc/SortingGroupRebuilder.cs.meta
            mv -f ExportedProject/ExportedProject/Assets/CoreSrc/RightMenu "$S/" 2>/dev/null || rm -rf ExportedProject/ExportedProject/Assets/CoreSrc/RightMenu
            mv -f ExportedProject/ExportedProject/Assets/CoreSrc/RightMenu.meta "$S/" 2>/dev/null || rm -f ExportedProject/ExportedProject/Assets/CoreSrc/RightMenu.meta
            # class Core 遮蔽 namespace Core（游戏作者命名冲突）→ 重命名类（namespace 不动）
            if grep -rl "class Core " ExportedProject/ExportedProject/Assets/CoreSrc/ >/dev/null 2>&1; then
              echo "发现 class Core 遮蔽命名空间，重命名为 CoreStatic"
              grep -rl "class Core " ExportedProject/ExportedProject/Assets/CoreSrc/ 2>/dev/null | while read f; do
                sed -i '' 's/\bclass Core /class CoreStatic /g' "$f" 2>/dev/null || sed -i 's/\bclass Core /class CoreStatic /g' "$f"
              done
            fi
            echo "Core 源码已拆出到 Assets/CoreSrc ($(find ExportedProject/ExportedProject/Assets/CoreSrc -name '*.cs' | wc -l) 个 .cs)"
          fi
          for n in $KEEP_META_LIST; do
            rm -f "$P/$n.dll" && echo "pre-deleted $n.dll (meta kept)"
          done
          # 3) 彻底删除（不需要 GUID 的）
          rm -f "$P/__Generated.dll" "$P/__Generated.dll.meta" "$P/System.Runtime.CompilerServices.Unsafe.dll" "$P/System.Runtime.CompilerServices.Unsafe.dll.meta"
          # 4) 清除所有 DummyDll 来源的 DLL（含 Il2CppDummyDll 特性引用，UnityLinker 解析即崩）：
          #    Core.dll 由 CoreSrc 的 stub 源码真实化；其余无人引用直接删（meta 保留）
          rm -f "$P/Core.dll" "$P/Unity.MemoryProfiler.dll" "$P/Unity.InternalAPIEngineBridge.001.dll" \
                "$P/Unity.RenderPipeline.Universal.ShaderLibrary.dll"
          echo "dummy 清理完成: $(ls "$P" | grep -c '\\.dll$') 个 dll 剩余"
          # 5) Core 框架 stub（游戏代码仅引用 Singleton<T>；签名兼容 il2cpp 用法）
          mkdir -p ExportedProject/ExportedProject/Assets/CoreSrc
          cat > ExportedProject/ExportedProject/Assets/CoreSrc/Singleton.cs <<'EOF'
          namespace Core {
              public abstract class Singleton<T> : UnityEngine.MonoBehaviour where T : UnityEngine.MonoBehaviour {
                  public static T Instance;
              }
          }
          EOF
          ls -la "$P" | head -40

      - name: 源码完整性恢复（缺失类从原始包找回 + 解除误禁用 + 清除污染 stub）
        run: |
          set -x
          S=ExportedProject/ExportedProject/Assets/Scripts
          # 1) 确保原始包在手（历史累积包丢过 Plant.cs 等核心源码）
          if [ ! -f ep-orig.tar.gz ]; then
            if [ -f ep.tar.gz ]; then
              cp ep.tar.gz ep-orig.tar.gz   # 回退分支：ep.tar.gz 即原始包
            else
              curl -sfL -o ep-orig.tar.gz "https://github.com/${{ github.repository }}/releases/download/rebuild-41-stagea/exported-41.tar.gz"
            fi
          fi
          rm -rf /tmp/orig-src && mkdir -p /tmp/orig-src
          tar xzf ep-orig.tar.gz -C /tmp/orig-src "ExportedProject/ExportedProject/Assets/Scripts" 2>/dev/null || true
          ORIG=/tmp/orig-src/ExportedProject/ExportedProject/Assets/Scripts
          # 2) 原始包有、工程没有的 .cs/.meta → 恢复（防 stub 空壳化污染）
          #    排除 Assembly-CSharp/Core（已拆出到 CoreSrc，恢复会重复定义）
          n=0
          cd "$ORIG" 2>/dev/null && find . \( -path ./Assembly-CSharp/Core -o -path ./Assembly-CSharp/Core.meta \) -prune -o \( -name "*.cs" -o -name "*.cs.meta" \) -print | while read -r rel; do
            if [ ! -f "$OLDPWD/$S/$rel" ]; then
              mkdir -p "$OLDPWD/$S/$(dirname "$rel")"
              cp "$rel" "$OLDPWD/$S/$rel" && n=$((n+1))
            fi
          done
          cd "$GITHUB_WORKSPACE"
          echo "恢复缺失源码文件: $(find $S -name '*.cs' | wc -l) 个 .cs 现存"
          # 3) 解除全部误禁用（CS0426 盲禁的文件；根因修复后大多可编译）
          find "$S" -name "*.cs.disabled" | while read -r f; do mv -f "$f" "${f%.disabled}"; done
          find "$S" -name "*.cs.disabled.meta" | while read -r f; do mv -f "$f" "${f%.disabled.meta}.meta"; done
          # 4) 清除污染 stub（遮蔽真实类型；真实类型随 ugui 包/源码恢复回归）
          rm -rf ExportedProject/ExportedProject/Assets/Scripts/Stubs ExportedProject/ExportedProject/Assets/Scripts/Stubs.meta
          echo "=== 恢复后统计 ==="
          echo "cs: $(find $S -name '*.cs' | wc -l)  disabled: $(find $S -name '*.disabled' | wc -l)  stubs: $(ls ExportedProject/ExportedProject/Assets/Scripts/Stubs 2>/dev/null | wc -l)"

      - name: Newtonsoft.Json 真实 DLL 覆盖（NuGet）
        run: |
          set -x
          P=ExportedProject/ExportedProject/Assets/Plugins
          curl -sL -o nj.nupkg "https://api.nuget.org/v3-flatcontainer/newtonsoft.json/13.0.3/newtonsoft.json.13.0.3.nupkg"
          unzip -o -q nj.nupkg -d nj
          NJDLL=$(find nj -path "*netstandard2.0*" -name "Newtonsoft.Json.dll" | head -1)
          cp "$NJDLL" "$P/Newtonsoft.Json.dll" && echo "Newtonsoft replaced ($NJDLL)"
          ls -la "$P/Newtonsoft.Json.dll"

      - name: manifest.json 写入官方包（registry 校验版本存在）
        run: |
          cd ExportedProject/ExportedProject
          python3 - <<'PY'
          import json, subprocess, sys
          pkgs = {
            "com.unity.render-pipelines.universal": ["14.0.11", "14.0.9", "14.0.8"],
            "com.unity.render-pipelines.core":      ["14.0.11", "14.0.9", "14.0.8"],
            "com.unity.shadergraph":                ["14.0.11", "14.0.9", "14.0.8"],
            "com.unity.2d.animation":               ["9.2.1", "9.2.2"],
            "com.unity.2d.common":                  ["8.1.1", "8.1.0"],
            "com.unity.2d.spriteshape":             ["8.0.1", "8.0.0"],
            "com.unity.2d.tilemap.extras":          ["3.1.2", "3.1.1", "3.0.1", "2.2.4"],
            "com.unity.textmeshpro":                ["3.0.9", "3.0.6"],
            "com.unity.burst":                      ["1.8.19", "1.8.12", "1.8.4"],
            "com.unity.collections":                ["1.5.1", "2.1.4"],
            "com.unity.mathematics":                ["1.2.6", "1.2.1"],
            "com.unity.visualscripting":            ["1.9.4", "1.8.0", "1.7.8"],
            "com.unity.ugui":                       ["1.0.0"],
          }
          def check(pkg, ver):
              try:
                  out = subprocess.run(["curl","-sL","--max-time","30",
                      f"https://packages.unity.com/{pkg}"], capture_output=True, timeout=40).stdout
                  data = json.loads(out)
                  vs = data.get("versions", {})
                  return ver in vs
              except Exception as e:
                  print("check fail", pkg, e); return False
          mf = json.load(open("Packages/manifest.json"))
          chosen = {}
          for pkg, cands in pkgs.items():
              ok = None
              for v in cands:
                  if check(pkg, v): ok = v; break
              if ok is None:
                  ok = cands[0]; print("WARN: no verified version for", pkg, "using", ok)
              chosen[pkg] = ok
          mf["dependencies"].update(chosen)
          json.dump(mf, open("Packages/manifest.json","w"), indent=2)
          print(json.dumps(chosen, indent=1))
          PY
          cat Packages/manifest.json | head -30

      - name: 下载第三方库源码 + 自写 asmdef
        run: |
          set -x
          A=ExportedProject/ExportedProject/Assets/ThirdParty
          mkdir -p "$A/spine" "$A/unitask" "$A/sfb"
          set -o pipefail
          # spine 4.1（sparse clone，只要 Runtime）
          for TRY in 1 2 3; do
            git clone --depth 1 --filter=blob:none --sparse --branch 4.1 \
              https://github.com/EsotericSoftware/spine-runtimes /tmp/spine 2>&1 | tail -1 && break
            rm -rf /tmp/spine; sleep 10
          done
          (cd /tmp/spine && git sparse-checkout set spine-unity/Assets/Spine spine-csharp/src 2>&1 | tail -1)
          cp -R /tmp/spine/spine-unity/Assets/Spine/Runtime/* "$A/spine/" 2>/dev/null || true
          # spine-csharp 核心源码（Runtime/spine-csharp/ 只是占位「add spine-csharp here.txt」）
          cp -R /tmp/spine/spine-csharp/src/* "$A/spine/" 2>/dev/null || true
          # 连 .asmdef.meta 一起删（孤儿 meta 会让 Unity 把子目录 .cs 分配给不存在的程序集）
          find "$A/spine" -name "*.asmdef*" -delete
          # spine 合并为单一程序集（spine-csharp + spine-unity 同程序集，无引用问题）
          # UniTask 2.5.10（git clone，codeload archive 会限流）
          for TRY in 1 2 3; do
            git clone --depth 1 --branch 2.5.10 https://github.com/Cysharp/UniTask /tmp/unitask-repo 2>&1 | tail -1 && break
            rm -rf /tmp/unitask-repo; sleep 10
          done
          cp -R /tmp/unitask-repo/src/UniTask/Assets/Plugins/UniTask/Runtime/* "$A/unitask/"
          find "$A/unitask" -name "*.asmdef*" -delete
          # UnityWebRequest 段条件编译在 iOS 下被排除（UNITASK_WEBREQUEST_SUPPORT 未定义）→ 全目录放宽
          grep -rl 'UNITASK_WEBREQUEST_SUPPORT' "$A/unitask/" 2>/dev/null | while read -r f; do
            sed -i.bak 's/#if ENABLE_UNITYWEBREQUEST && (!UNITY_2019_1_OR_NEWER || UNITASK_WEBREQUEST_SUPPORT)/#if ENABLE_UNITYWEBREQUEST/' "$f" 2>/dev/null || \
              sed -i 's/#if ENABLE_UNITYWEBREQUEST && (!UNITY_2019_1_OR_NEWER || UNITASK_WEBREQUEST_SUPPORT)/#if ENABLE_UNITYWEBREQUEST/' "$f"
            rm -f "$f.bak"
          done
          grep -n "ENABLE_UNITYWEBREQUEST" "$A/unitask/UnityAsyncExtensions.cs" | head -3
          # SimpleFileBrowser（正确路径：Plugins/SimpleFileBrowser 含全套 Prefabs/Resources）
          for TRY in 1 2 3; do
            git clone --depth 1 https://github.com/yasirkula/UnitySimpleFileBrowser /tmp/sfb-repo 2>&1 | tail -1 && break
            rm -rf /tmp/sfb-repo; sleep 10
          done
          ls /tmp/sfb-repo/Plugins/SimpleFileBrowser/ | head -5
          cp -R /tmp/sfb-repo/Plugins/SimpleFileBrowser/* "$A/sfb/"
          find "$A/sfb" -name "*.asmdef*" -delete
          # 自写 asmdef（name 与 Plugins DLL 同名；asmdef 之间必须显式引用）
          cat > "$A/spine/spine-unity.asmdef" <<'EOF'
          { "name": "spine-unity", "allowUnsafeCode": true, "autoReferenced": true }
          EOF
          cat > "$A/unitask/UniTask.asmdef" <<'EOF'
          { "name": "UniTask", "allowUnsafeCode": true, "autoReferenced": true }
          EOF
          cat > "$A/sfb/SimpleFileBrowser.Runtime.asmdef" <<'EOF'
          { "name": "SimpleFileBrowser.Runtime", "autoReferenced": true, "references": ["Unity.TextMeshPro"] }
          EOF
          # Core 源码的 asmdef（编译产物名与 Plugins/Core.dll 同名）
          cat > ExportedProject/ExportedProject/Assets/CoreSrc/Core.asmdef <<'EOF'
          { "name": "Core", "autoReferenced": true, "allowUnsafeCode": true }
          EOF
          echo "=== ThirdParty 结构 ==="
          find "$A" -maxdepth 2 -type d | head -15

      - name: 注入 CIPrepare 构建脚本
        run: |
          mkdir -p ExportedProject/ExportedProject/Assets/Editor
          cat > ExportedProject/ExportedProject/Assets/Editor/CIPrepare.cs <<'CS'
          using UnityEditor;
          using UnityEditor.Build.Reporting;
          using UnityEditor.PackageManager;
          using UnityEngine;
          using System.Linq;
          using System.IO;
          public static class CIPrepare {
              static readonly string[] CopyList = {
                  "Unity.RenderPipelines.Core.Runtime.dll",
                  "Unity.RenderPipelines.Universal.Runtime.dll",
                  "Unity.2D.Animation.Runtime.dll",
                  "Unity.2D.Common.Runtime.dll",
                  "Unity.2D.SpriteShape.Runtime.dll",
                  "Unity.2D.Tilemap.Extras.dll",
                  "Unity.TextMeshPro.dll",
                  "Unity.Collections.dll",
                  "Unity.Collections.LowLevel.ILSupport.dll",
                  "Unity.Burst.dll",
                  "Unity.Burst.Unsafe.dll",
                  "Unity.Mathematics.dll",
                  "Unity.VisualScripting.Core.dll",
                  "spine-unity.dll",
                  "UniTask.dll", "SimpleFileBrowser.Runtime.dll",
                  "UnityEngine.UI.dll", "Core.dll"
              };
              static readonly string[] PackagesToRemove = {
                  "com.unity.render-pipelines.universal",
                  "com.unity.render-pipelines.core",
                  "com.unity.shadergraph",
                  "com.unity.2d.animation", "com.unity.2d.common",
                  "com.unity.2d.spriteshape", "com.unity.2d.tilemap.extras",
                  "com.unity.textmeshpro", "com.unity.burst",
                  "com.unity.collections", "com.unity.mathematics",
                  "com.unity.visualscripting"
              };
              public static void PrepareAndBuild() {
                  // 两遍法已废除：第一遍(Editor define)编译的 dll 含 UNITY_EDITOR 专属代码，
                  // 拷进 Plugins 给 player 用会让 UnityLinker 解析 UnityEditor.CoreModule 崩溃。
                  // dummy DLL 已全部清除，包源码与第三方源码保留在场，player build 会以
                  // player define 正常编译全部程序集，无需任何 DLL 拷贝/包移除。
                  BuildIOS();
              }                  BuildIOS();
              }
              static void BuildIOS() {
                  var scenes = Directory.GetFiles("Assets", "*.unity", SearchOption.AllDirectories)
                      .Where(p => !p.Contains("/Plugins/"))
                      .Select(p => p.Replace("\\\\", "/"))
                      .OrderBy(p => p)
                      .ToArray();
                  Debug.Log("CI: found " + scenes.Length + " scenes: " + string.Join(",", scenes.Take(10)));
                  var opt = new BuildPlayerOptions {
                      scenes = scenes.Length > 0 ? scenes : new[]{"Assets/Scenes/SampleScene.unity"},
                      locationPathName = "iosbuild",
                      target = BuildTarget.iOS,
                      options = BuildOptions.None
                  };
                  var report = BuildPipeline.BuildPlayer(opt);
                  Debug.Log("CI: result=" + report.summary.result + " size=" + report.summary.totalSize);
                  if (report.summary.result != BuildResult.Succeeded) EditorApplication.Exit(2);
              }
          }
          CS
          echo "CIPrepare injected"

      - name: 修复-构建迭代循环（20 轮）
        run: |
          set -x
          cd ExportedProject/ExportedProject
          UNI="$UNITY_EXE"
          LOG="$PWD/unity_build.log"
          SUCCESS=0
          # 抑制海量 hiding/unassigned warning（几千条 CS0114 会撑爆 Bee 的 ## Output 截断，
          # 导致真正的 error 行丢失、修复器抓不到错误）
          printf '%s\n' -nowarn:0114 -nowarn:0108 -nowarn:0109 -nowarn:0649 \
            -nowarn:0219 -nowarn:0414 -nowarn:0067 -nowarn:0660 -nowarn:0661 -nowarn:3021 \
            > Assets/csc.rsp
          # 全量修复反编译丢失的 virtual（一次性建索引扫描全部 override，不再依赖错误驱动）
          python3 "$GITHUB_WORKSPACE/tools/fix_virtual_all.py" "$PWD" || true
          # 修复历史损坏行（virtual 误替换了 override int）
          sed -i '' 's/public virtual MaxCount => 0;/public override int MaxCount => 0;/' \
            Assets/Scripts/Assembly-CSharp/GameLevel/RogueShooting/GeneralBuff.cs 2>/dev/null || \
            sed -i 's/public virtual MaxCount => 0;/public override int MaxCount => 0;/' \
            Assets/Scripts/Assembly-CSharp/GameLevel/RogueShooting/GeneralBuff.cs 2>/dev/null || true
          echo "=== GeneralBuff.cs 修复后现场（诊断） ==="
          sed -n '1,15p' Assets/Scripts/Assembly-CSharp/GameLevel/RogueShooting/GeneralBuff.cs 2>/dev/null || true
          echo "=== BaseBuff.cs 的 MaxCount（诊断） ==="
          grep -n "MaxCount" Assets/Scripts/Assembly-CSharp/BaseBuff.cs 2>/dev/null | head -3 || true
          for ROUND in $(seq 1 20); do
            echo "########## 迭代 $ROUND ##########"
            rm -f "$LOG"
            perl -e 'alarm 2400; exec @ARGV' "$UNI" \
              -batchmode -nographics \
              -projectPath "$PWD" \
              -buildTarget iOS \
              -executeMethod CIPrepare.PrepareAndBuild \
              -logFile - 2>&1 | tee "$LOG"
            echo "unity exit=$?"
            if [ -d iosbuild/Unity-iPhone.xcodeproj ]; then
              echo "XCODEPROJ_READY"
              SUCCESS=1
              break
            fi
            python3 "$GITHUB_WORKSPACE/tools/fix_compile_errors.py" "$LOG" "$PWD" || true
            echo "--- 迭代 $ROUND 失败，日志尾部 ---"
            tail -6 "$LOG" 2>/dev/null || true
          done
          [ "$SUCCESS" = "1" ] && echo "FINAL: SUCCESS" || echo "FINAL: NEED_MANUAL"
          echo "--- 剩余错误清单 ---"
          grep -E "error CS" "$LOG" 2>/dev/null | sort -u | head -30 || echo "(无)"

      - name: 核心日志上传 Release（手机端免翻墙读取）
        if: always()
        run: |
          cd ExportedProject/ExportedProject 2>/dev/null || true
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          curl -s -X POST -H "Authorization: token $TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d '{"tag_name":"build-logs","name":"构建日志"}' > /dev/null
          REL=$(curl -s -H "Authorization: token $TOKEN" https://api.github.com/repos/${{ github.repository }}/releases/tags/build-logs | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          if [ -f unity_build.log ]; then
            grep -E "error CS|FINAL:|迭代 |Script Compilation Error|错误总数|STAT |\[CI\]" unity_build.log | tail -800 > /tmp/build_summary.txt
            echo "=== 引用 UnityEditor 的程序集（linker 崩源诊断）===" >> /tmp/build_summary.txt
            grep -l "UnityEditor.CoreModule" ExportedProject/ExportedProject/Library/ScriptAssemblies/*.dll 2>/dev/null >> /tmp/build_summary.txt || echo "(none)" >> /tmp/build_summary.txt
            echo "=== xcodebuild/app 阶段 ===" >> /tmp/build_summary.txt
            tail -60 unity_build.log >> /tmp/build_summary.txt
          else
            echo "unity_build.log not found" > /tmp/build_summary.txt
          fi
          # 同名 asset 已存在 → 先删再传（否则 422 上传失败、摘要永远不更新）
          OLD_ID=$(curl -s -H "Authorization: token $TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/build-logs" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);a=[x for x in d.get('assets',[]) if x['name']=='build_summary.txt'];print(a[0]['id'] if a else '')")
          [ -n "$OLD_ID" ] && [ "$OLD_ID" != "None" ] && curl -s -X DELETE -H "Authorization: token $TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/$OLD_ID" > /dev/null
          curl -s -X POST -H "Authorization: token $TOKEN" -H "Content-Type: text/plain" \
            --data-binary @/tmp/build_summary.txt \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$REL/assets?name=build_summary.txt" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print('LOG UP:', d.get('name'), d.get('message',''))"

      - name: xcodebuild 编译 ipa
        run: |
          cd ExportedProject/ExportedProject
          [ -d iosbuild/Unity-iPhone.xcodeproj ] || { echo "no xcodeproj, build failed earlier"; exit 0; }
          cd iosbuild
          perl -e 'alarm 2700; exec @ARGV' xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" -derivedDataPath dd build 2>&1 | tail -30
          APP=$(find dd/Build/Products -name "*.app" | head -1)
          echo "APP=$APP"
          if [ -n "$APP" ]; then
            mkdir -p Payload && cp -R "$APP" Payload/
            zip -qr /tmp/PvzFusion-4.1-unsigned.ipa Payload
            curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/${{ github.repository }}/releases \
              -d '{"tag_name":"rebuild-41-ios","name":"PvZ Fusion 4.1 iOS（未签名，TrollStore 用）"}' > /dev/null
            REL=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ github.repository }}/releases/tags/rebuild-41-ios | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
            # 同名 asset 已存在 → 先删再传（否则 422 上传失败、IPA 永远是旧的）
            OLD_A=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/rebuild-41-ios" \
              | python3 -c "import json,sys;d=json.load(sys.stdin);a=[x for x in d.get('assets',[]) if x['name']=='PvzFusion-4.1-unsigned.ipa'];print(a[0]['id'] if a else '')")
            [ -n "$OLD_A" ] && [ "$OLD_A" != "None" ] && curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/$OLD_A" > /dev/null
            curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @/tmp/PvzFusion-4.1-unsigned.ipa \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$REL/assets?name=PvzFusion-4.1-unsigned.ipa" | python3 -c "import json,sys;d=json.load(sys.stdin);print('RELEASED:', d.get('name'), d.get('size'), d.get('message',''))"
          fi

      - name: 上传累积修复版 Assets 到 Release（供下一轮增量收敛）
        if: always()
        run: |
          [ -d ExportedProject/ExportedProject/Assets ] || { echo "no assets"; exit 0; }
          cd ExportedProject/ExportedProject
          tar czf /tmp/ep-assets-fixed.tar.gz Assets
          cd "$GITHUB_WORKSPACE"
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          curl -s -X POST -H "Authorization: token $TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d '{"tag_name":"rebuild-41-progress","name":"B 阶段累积修复版（自动）"}' > /dev/null || true
          REL=$(curl -s -H "Authorization: token $TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/tags/rebuild-41-progress" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          # 删旧 asset（覆盖）
          OLD=$(curl -s -H "Authorization: token $TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/tags/rebuild-41-progress" | python3 -c "import json,sys; d=json.load(sys.stdin); a=[x for x in d.get('assets',[]) if x['name']=='ep-assets-fixed.tar.gz']; print(a[0]['id'] if a else '')")
          [ -n "$OLD" ] && curl -s -X DELETE -H "Authorization: token $TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/assets/$OLD" > /dev/null
          curl -s -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/octet-stream" \
            --data-binary @/tmp/ep-assets-fixed.tar.gz \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$REL/assets?name=ep-assets-fixed.tar.gz" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print('SAVED:', d.get('name'), round(d.get('size',0)/1024/1024,1),'MB', d.get('message',''))"

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b23-logs
          path: ExportedProject/ExportedProject/unity_build.log
          if-no-files-found: ignore
