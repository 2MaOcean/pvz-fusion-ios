name: Rebuild 4.1 — Stage B1 (安装 Unity + 生成激活申请)

on:
  workflow_dispatch:

jobs:
  setup-unity:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: 下载 Unity 2021.3.9f1 编辑器 + iOS 模块
        run: |
          fetch() { # $1=输出 $2=URL $3=期望最小字节
            for i in $(seq 1 15); do
              curl -sL --max-time 600 -C - -o "$1" "$2" && S=$(stat -f%z "$1") && [ "$S" -gt "$3" ] && echo "$1 OK ($S)" && return 0
              echo "retry $i size=$(stat -f%z "$1" 2>/dev/null || echo 0)"; sleep 3
            done
            echo "$1 download FAILED"; return 1
          }
          fetch unity.pkg "https://download.unity3d.com/download_unity/ad3870b89536/MacEditorInstaller/Unity-2021.3.9f1.pkg" 2900000000
          fetch ios.pkg "https://download.unity3d.com/download_unity/ad3870b89536/MacEditorTargetInstaller/UnitySetup-iOS-Support-for-Editor-2021.3.9f1.pkg" 600000000 || \
          fetch ios.pkg "https://download.unitychina.cn/download_unity/ad3870b89536/MacEditorTargetInstaller/UnitySetup-iOS-Support-for-Editor-2021.3.9f1.pkg" 600000000
          ls -la unity.pkg ios.pkg

      - name: 安装
        run: |
          sudo installer -pkg unity.pkg -target /
          sudo installer -pkg ios.pkg -target /
          UNI=$(find /Applications -maxdepth 5 -path "*Unity.app/Contents/MacOS/Unity" 2>/dev/null | head -1)
          echo "Unity at: $UNI"
          [ -n "$UNI" ] && "$UNI" -version
          echo "UNITY_EXE=$UNI" >> $GITHUB_ENV

      - name: 生成手动激活申请文件 (.alf)
        run: |
          UNI="$UNITY_EXE"
          cd "$HOME"
          "$UNI" -batchmode -nographics -quit -createManualActivationFile -logFile alf.log || true
          tail -5 alf.log || true
          ALF=$(find "$HOME" "$GITHUB_WORKSPACE" -name "Unity_v*.alf" 2>/dev/null | head -1)
          echo "ALF=$ALF" >> $GITHUB_ENV
          [ -n "$ALF" ] && head -3 "$ALF" && echo "alf ready" || echo "ALF NOT FOUND"

      - name: 上传 .alf
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: |
            ${{ env.ALF }}
            alf.log
          if-no-files-found: warn
